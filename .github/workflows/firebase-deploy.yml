name: Firebase 자동 배포

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase CLI 설치
        run: npm install -g firebase-tools

      - name: Functions 의존성 설치
        run: npm install
        working-directory: functions

      - name: 서비스 계정 키 파일 생성
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa-key.json

      - name: Firebase 배포 (Hosting + DB Rules)
        run: firebase deploy --non-interactive --project krafton-tennis --only hosting,database
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
