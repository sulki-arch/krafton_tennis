<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사용자 차단 & 정리</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{font-family:'Apple SD Gothic Neo',sans-serif;max-width:600px;margin:40px auto;padding:20px;background:#f4f6fb}
h2{color:#e53935;margin-bottom:8px}
.desc{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6}
button{background:#e53935;color:#fff;border:none;padding:12px 32px;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
button:disabled{background:#bbb;cursor:not-allowed}
#log{margin-top:20px;background:#fff;border-radius:10px;padding:16px;font-size:12px;line-height:2;max-height:400px;overflow-y:auto;border:1px solid #e0e0e0}
.ok{color:#2e7d32}.skip{color:#888}.err{color:#e53935}
#summary{font-size:14px;font-weight:700;margin-top:12px;padding:12px 16px;background:#fce4ec;border-radius:8px;display:none}
</style>
</head>
<body>
<h2>🚫 사용자 차단 & 데이터 정리</h2>
<p class="desc">
  <b>차단 대상:</b> <code>moo9n20x</code><br>
  1. /cal/users 에서 해당 계정 삭제<br>
  2. 모든 일정의 참석자 목록에서 제거<br>
  3. 앱 로그인 불가 처리
</p>
<button id="btn" onclick="run()">🚫 차단 실행</button>
<div id="log"></div>
<div id="summary"></div>

<script>
const FIREBASE_CONFIG = {
  databaseURL: 'https://krafton-tennis-default-rtdb.asia-southeast1.firebasedatabase.app'
};
const BLOCK_ID = 'moo9n20x';

function log(msg, cls=''){
  const d = document.getElementById('log');
  d.innerHTML += `<div class="${cls}">${msg}</div>`;
  d.scrollTop = d.scrollHeight;
}

function fbArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  if(typeof v==='object') return Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(k=>v[k]);
  return [];
}

async function run(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '처리 중...';
  document.getElementById('log').innerHTML = '';

  try {
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    // ── 1. /cal/users 에서 제거 ──
    log('👤 사용자 목록 확인 중...');
    const usersSnap = await db.ref('/cal/users').once('value');
    const users = fbArr(usersSnap.val());
    const before = users.length;
    const filtered = users.filter(u => (u.id||u.username) !== BLOCK_ID);
    const removed = before - filtered.length;

    if(removed > 0){
      await db.ref('/cal/users').set(filtered);
      log(`✅ 사용자 목록에서 ${BLOCK_ID} 삭제 완료 (${before}명 → ${filtered.length}명)`, 'ok');
    } else {
      log(`⬜ 사용자 목록에 ${BLOCK_ID} 없음 (이미 없거나 다른 경로에 존재)`, 'skip');
    }

    // shcal_u (구 경로)에서도 제거
    const oldSnap = await db.ref('shcal_u').once('value');
    const oldUsers = fbArr(oldSnap.val());
    const oldFiltered = oldUsers.filter(u => (u.id||u.username) !== BLOCK_ID);
    if(oldFiltered.length < oldUsers.length){
      await db.ref('shcal_u').set(oldFiltered);
      log(`✅ shcal_u(구 경로)에서도 ${BLOCK_ID} 삭제`, 'ok');
    }

    // ── 2. 모든 이벤트의 attendees에서 제거 ──
    log('📅 일정 데이터 확인 중...');
    const evSnap = await db.ref('/cal/events').once('value');
    const events = fbArr(evSnap.val());
    let evFixed = 0;
    const fixedEvents = events.map(ev => {
      const atts = fbArr(ev.attendees);
      if(atts.includes(BLOCK_ID)){
        evFixed++;
        log(`🗑️ 일정 "${ev.title}" 참석자에서 제거`, 'ok');
        return {...ev, attendees: atts.filter(id => id !== BLOCK_ID)};
      }
      return ev;
    });

    if(evFixed > 0){
      await db.ref('/cal/events').set(fixedEvents);
      log(`✅ 총 ${evFixed}개 일정에서 참석자 제거 완료`, 'ok');
    } else {
      log('⬜ 참석자로 등록된 일정 없음', 'skip');
    }

    log('🎉 차단 완료!', 'ok');
    const sum = document.getElementById('summary');
    sum.style.display = 'block';
    sum.textContent = `🚫 ${BLOCK_ID} 차단 완료 — 사용자 삭제 ${removed}건, 일정 참석자 제거 ${evFixed}건`;
    btn.textContent = '✅ 완료';

  } catch(e){
    log('❌ 오류: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
}
</script>
</body>
</html>
