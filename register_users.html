function log(msg, cls=''){
  const d = document.getElementById('log');
  d.innerHTML += `<div class="${cls}">${msg}</div>`;
  d.scrollTop = d.scrollHeight;
}

function fbArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v;
  if(typeof v==='object') return Object.keys(v).sort((a,b)=>Number(a)-Number(b)).map(k=>v[k]);
  return [];
}

async function run(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '등록 중...';
  document.getElementById('log').innerHTML = '';

  try {
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();

    log('🔗 Firebase 연결 중...');
    const snap = await db.ref(UK).once('value');
    const existing = fbArr(snap.val());
    log(`✅ 기존 사용자 ${existing.length}명 확인`);

    let added = 0, skipped = 0;
    const users = [...existing];

    for(const nu of NEW_USERS){
      const exists = users.find(u => (u.id||u.username) === nu.id);
      if(exists){
        log(`⬜ 건너뜀 (이미 존재): ${nu.name} (${nu.id})`, 'skip');
        skipped++;
        continue;
      }
      const userObj = {
        id: nu.id,
        username: nu.id,
        name: nu.name,
        password: nu.id,
        role: nu.role || 'user',
        avatar: null
      };
      users.push(userObj);
      log(`✅ 등록: ${nu.name} (${nu.id})`, 'ok');
      added++;
    }

    log('💾 Firebase에 저장 중...');
    await db.ref(UK).set(users);
    log(`🎉 완료! 총 ${users.length}명 (신규 ${added}명 / 건너뜀 ${skipped}명)`);

    const sum = document.getElementById('summary');
    sum.style.display = 'block';
    sum.textContent = `✅ 등록 완료 — 전체 ${users.length}명 (신규 ${added}명 추가, ${skipped}명 중복 건너뜀)`;
    btn.textContent = '✅ 완료';
  } catch(e){
    log('❌ 오류: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '다시 시도';
  }
}
